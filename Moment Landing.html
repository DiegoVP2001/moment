<style>
  :root{
    --pink:#e6c6c7;
    --pink-50:#f6e6e7;
    --pink-100:#efd7d8;
    --pink-200:#e6c6c7;
    --pink-300:#d7a8a9;
    --ink:#1a1823;
    --ink-80:#2a2735;
    --ink-60:#4a4655;
    --teal:#7bbfbf;
    --teal-dark:#5fa8a8;
    --blue:#6aa6da;
    --cream:#faf5f2;
    --white:#ffffff;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--cream);color:var(--ink);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  body{overflow-x:hidden}
  img{display:block;max-width:100%}
  a{color:inherit;text-decoration:none}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}

  .body-compact{--s:0.85}
  .body-amplio{--s:1.1}

<body>
<div id="root"></div>

<script>
// WhatsApp click handler: shows an inline modal with options to avoid
// api.whatsapp.com redirect (blocked in some networks/browsers).
(function(){
  const NUM = '56998928078';
  const NUM_PRETTY = '+56 9 9892 8078';

  function openModal(msg) {
    const existing = document.getElementById('wa-modal'); if (existing) existing.remove();
    const waMe = `https://wa.me/${NUM}?text=${encodeURIComponent(msg)}`;
    const waWeb = `https://web.whatsapp.com/send?phone=${NUM}&text=${encodeURIComponent(msg)}`;
    const waProto = `whatsapp://send?phone=${NUM}&text=${encodeURIComponent(msg)}`;

    const overlay = document.createElement('div');
    overlay.id = 'wa-modal';
    overlay.style.cssText = 'position:fixed;inset:0;background:rgba(15,13,23,.78);backdrop-filter:blur(8px);z-index:9999;display:flex;align-items:center;justify-content:center;padding:24px;font-family:Jost,Inter,system-ui,sans-serif';
    overlay.innerHTML = `
      <div style="background:#fff;border-radius:24px;max-width:480px;width:100%;padding:36px;color:#1a1823;position:relative;box-shadow:0 30px 80px rgba(0,0,0,.4)">
        <button id="wa-close" style="position:absolute;top:16px;right:16px;width:32px;height:32px;border:none;border-radius:50%;background:#efd7d8;font-size:18px;cursor:pointer">×</button>
        <div style="width:56px;height:56px;border-radius:16px;background:#25d366;display:flex;align-items:center;justify-content:center;margin-bottom:20px">
          <svg viewBox="0 0 32 32" width="30" height="30" fill="#fff"><path d="M16 3C9 3 3 9 3 16c0 2.5.7 4.9 2 7L3 29l6.3-2c2 1 4.3 1.6 6.7 1.6 7 0 13-6 13-13S23 3 16 3zm7.5 18.3c-.3.9-1.6 1.7-2.3 1.8-.6.1-1.3.1-2.1-.1-.5-.2-1.1-.3-1.9-.7-3.3-1.4-5.5-4.7-5.7-5-.2-.2-1.4-1.9-1.4-3.6 0-1.7.9-2.6 1.2-2.9.3-.3.7-.4 1-.4h.7c.2 0 .5 0 .8.6.3.7 1 2.4 1.1 2.6.1.2.1.4 0 .6-.1.2-.2.4-.4.6-.2.2-.4.4-.5.6-.2.2-.4.4-.2.7.2.3.9 1.5 2 2.5 1.4 1.3 2.7 1.7 3 1.8.3.1.5.1.7-.1.2-.2.8-.9 1-1.2.2-.3.4-.3.7-.2.3.1 1.9.9 2.2 1.1.3.2.5.2.6.3.1.2.1.9-.2 1.8z"/></svg>
        </div>
        <h3 style="font-family:'Archivo Black',sans-serif;font-size:24px;margin:0 0 8px;letter-spacing:-0.01em">Contactar por WhatsApp</h3>
        <p style="font-size:14px;color:#4a4655;line-height:1.5;margin:0 0 24px">Elige cómo abrir el chat. Si el botón principal te bloquea, prueba con WhatsApp Web o copia el mensaje.</p>
        <div style="background:#faf5f2;border-radius:12px;padding:14px 16px;margin-bottom:20px;font-size:13px;color:#2a2735;line-height:1.5;border-left:3px solid #7bbfbf">
          <div style="font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:#4a4655;margin-bottom:6px;font-family:monospace">Mensaje</div>
          <div id="wa-msg-preview"></div>
          <div style="font-size:11px;color:#4a4655;margin-top:8px;font-family:monospace">→ ${NUM_PRETTY}</div>
        </div>
        <div style="display:flex;flex-direction:column;gap:10px">
          <a id="wa-link-app" href="${waProto}" style="display:block;text-align:center;padding:14px 20px;border-radius:999px;background:#25d366;color:#fff;font-weight:600;font-size:15px;text-decoration:none">Abrir en app WhatsApp</a>
          <a id="wa-link-web" href="${waWeb}" target="_blank" rel="noopener noreferrer" style="display:block;text-align:center;padding:14px 20px;border-radius:999px;background:#1a1823;color:#fff;font-weight:600;font-size:15px;text-decoration:none">Abrir en WhatsApp Web</a>
          <button id="wa-copy" style="padding:14px 20px;border-radius:999px;background:transparent;border:1.5px solid #1a1823;color:#1a1823;font-weight:600;font-size:15px;cursor:pointer;font-family:inherit">Copiar mensaje + número</button>
        </div>
      </div>`;
    document.body.appendChild(overlay);
    overlay.querySelector('#wa-msg-preview').textContent = msg;
    const close = () => overlay.remove();
    overlay.addEventListener('click', e => { if (e.target === overlay) close(); });
    overlay.querySelector('#wa-close').addEventListener('click', close);
    overlay.querySelector('#wa-link-app').addEventListener('click', close);
    overlay.querySelector('#wa-link-web').addEventListener('click', close);
    overlay.querySelector('#wa-copy').addEventListener('click', async (e) => {
      const btn = e.currentTarget;
      try {
        await navigator.clipboard.writeText(`${NUM_PRETTY}\n\n${msg}`);
        btn.textContent = '✓ Copiado';
        btn.style.background = '#efd7d8';
        btn.style.borderColor = '#efd7d8';
        setTimeout(close, 900);
      } catch {
        btn.textContent = 'No se pudo copiar';
      }
    });
  }
  window.__openWhatsApp = openModal;

  document.addEventListener('click', function(e){
    const a = e.target.closest && e.target.closest('a[href]');
    if (!a) return;
    const href = a.getAttribute('href') || '';
    // WhatsApp → show modal instead of letting browser follow the redirect
    if (/^https?:\/\/(wa\.me|api\.whatsapp\.com|web\.whatsapp\.com|chat\.whatsapp\.com)/i.test(href)) {
      e.preventDefault(); e.stopPropagation();
      const u = new URL(href);
      const msg = u.searchParams.get('text') || '¡Hola! Me gustaría más información sobre Moment.';
      openModal(msg);
      return;
    }
    // Other external links (Instagram, Maps) → break out of iframe
    if (/^https?:\/\/(www\.instagram\.com|instagram\.com|maps\.app\.goo\.gl|www\.google\.com\/maps)/i.test(href)) {
      e.preventDefault();
      try { (window.top || window).open(href, '_blank', 'noopener,noreferrer'); }
      catch { window.open(href, '_blank', 'noopener,noreferrer'); }
    }
  }, true);
})();
</script>
