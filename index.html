<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Moment — Centro Deportivo</title>
<link rel="icon" href="assets/logo-isotype-dark.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;500;600;700;800;900&family=Jost:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&family=Caveat:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --pink:#e6c6c7;--pink-50:#f6e6e7;--pink-100:#efd7d8;--pink-200:#e6c6c7;--pink-300:#d7a8a9;
    --ink:#1a1823;--ink-80:#2a2735;--ink-60:#4a4655;
    --teal:#7bbfbf;--teal-dark:#5fa8a8;--blue:#6aa6da;
    --cream:#faf5f2;--white:#ffffff;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--cream);color:var(--ink);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  body{overflow-x:hidden}
  img{display:block;max-width:100%}
  a{color:inherit;text-decoration:none}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
</style>
</head>
<body>
<div id="root"></div>

<script>
// WhatsApp click interceptor (modal with options)
(function(){
  const NUM='56998928078', PRETTY='+56 9 9892 8078';
  function openModal(msg){
    let m=document.getElementById('wa-modal');if(m)m.remove();
    const waProto=`whatsapp://send?phone=${NUM}&text=${encodeURIComponent(msg)}`;
    const waWeb=`https://web.whatsapp.com/send?phone=${NUM}&text=${encodeURIComponent(msg)}`;
    const o=document.createElement('div');o.id='wa-modal';
    o.style.cssText='position:fixed;inset:0;background:rgba(15,13,23,.78);backdrop-filter:blur(8px);z-index:9999;display:flex;align-items:center;justify-content:center;padding:24px;font-family:Jost,system-ui,sans-serif';
    o.innerHTML=`<div style="background:#fff;border-radius:24px;max-width:460px;width:100%;padding:32px;color:#1a1823;position:relative;box-shadow:0 30px 80px rgba(0,0,0,.4)">
      <button id="wa-close" style="position:absolute;top:14px;right:14px;width:32px;height:32px;border:none;border-radius:50%;background:#efd7d8;font-size:18px;cursor:pointer">×</button>
      <div style="width:48px;height:48px;border-radius:14px;background:#25d366;display:flex;align-items:center;justify-content:center;margin-bottom:16px"><svg viewBox="0 0 32 32" width="26" height="26" fill="#fff"><path d="M16 3C9 3 3 9 3 16c0 2.5.7 4.9 2 7L3 29l6.3-2c2 1 4.3 1.6 6.7 1.6 7 0 13-6 13-13S23 3 16 3zm7.5 18.3c-.3.9-1.6 1.7-2.3 1.8-.6.1-1.3.1-2.1-.1-.5-.2-1.1-.3-1.9-.7-3.3-1.4-5.5-4.7-5.7-5-.2-.2-1.4-1.9-1.4-3.6 0-1.7.9-2.6 1.2-2.9.3-.3.7-.4 1-.4h.7c.2 0 .5 0 .8.6.3.7 1 2.4 1.1 2.6.1.2.1.4 0 .6-.1.2-.2.4-.4.6-.2.2-.4.4-.5.6-.2.2-.4.4-.2.7.2.3.9 1.5 2 2.5 1.4 1.3 2.7 1.7 3 1.8.3.1.5.1.7-.1.2-.2.8-.9 1-1.2.2-.3.4-.3.7-.2.3.1 1.9.9 2.2 1.1.3.2.5.2.6.3.1.2.1.9-.2 1.8z"/></svg></div>
      <h3 style="font-family:'Archivo Black',sans-serif;font-size:22px;margin:0 0 6px">Contactar por WhatsApp</h3>
      <p style="font-size:13px;color:#4a4655;line-height:1.4;margin:0 0 20px">Elige cómo abrir el chat.</p>
      <div style="background:#faf5f2;border-radius:10px;padding:12px 14px;margin-bottom:18px;font-size:13px;color:#2a2735;line-height:1.4;border-left:3px solid #7bbfbf"><div id="wa-msg-preview"></div><div style="font-size:11px;color:#4a4655;margin-top:6px;font-family:monospace">→ ${PRETTY}</div></div>
      <div style="display:flex;flex-direction:column;gap:8px">
        <a id="wa-link-app" href="${waProto}" style="display:block;text-align:center;padding:13px 18px;border-radius:999px;background:#25d366;color:#fff;font-weight:600;font-size:14px;text-decoration:none">Abrir en app WhatsApp</a>
        <a id="wa-link-web" href="${waWeb}" target="_blank" rel="noopener noreferrer" style="display:block;text-align:center;padding:13px 18px;border-radius:999px;background:#1a1823;color:#fff;font-weight:600;font-size:14px;text-decoration:none">Abrir WhatsApp Web</a>
        <button id="wa-copy" style="padding:13px 18px;border-radius:999px;background:transparent;border:1.5px solid #1a1823;color:#1a1823;font-weight:600;font-size:14px;cursor:pointer;font-family:inherit">Copiar mensaje + número</button>
      </div></div>`;
    document.body.appendChild(o);
    o.querySelector('#wa-msg-preview').textContent=msg;
    const close=()=>o.remove();
    o.addEventListener('click',e=>{if(e.target===o)close();});
    o.querySelector('#wa-close').addEventListener('click',close);
    o.querySelector('#wa-link-app').addEventListener('click',close);
    o.querySelector('#wa-link-web').addEventListener('click',close);
    o.querySelector('#wa-copy').addEventListener('click',async e=>{
      try{await navigator.clipboard.writeText(`${PRETTY}\n\n${msg}`);e.currentTarget.textContent='✓ Copiado';e.currentTarget.style.background='#efd7d8';e.currentTarget.style.borderColor='#efd7d8';setTimeout(close,800);}catch{e.currentTarget.textContent='No se pudo copiar';}
    });
  }
  document.addEventListener('click',function(e){
    const a=e.target.closest&&e.target.closest('a[href]');if(!a)return;
    const h=a.getAttribute('href')||'';
    if(/^https?:\/\/(wa\.me|api\.whatsapp\.com|web\.whatsapp\.com)/i.test(h)){
      e.preventDefault();e.stopPropagation();
      const u=new URL(h);openModal(u.searchParams.get('text')||'¡Hola! Me gustaría más información sobre Moment.');return;
    }
    if(/^https?:\/\/(www\.instagram\.com|maps\.app\.goo\.gl|www\.google\.com\/maps)/i.test(h)){
      e.preventDefault();try{(window.top||window).open(h,'_blank','noopener,noreferrer');}catch{window.open(h,'_blank');}
    }
  },true);
})();
</script>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="src/v2/data.jsx"></script>
<script type="text/babel" src="src/v2/shared.jsx"></script>
<script type="text/babel" src="src/v2/hero-services.jsx"></script>
<script type="text/babel" src="src/v2/sections-mid.jsx"></script>
<script type="text/babel" src="src/v2/sections-bottom.jsx"></script>
<script type="text/babel" src="src/v2/app.jsx"></script>
</body>
</html>
