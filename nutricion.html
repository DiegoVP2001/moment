<script type="text/babel">
function App() {
  const { useEffect } = React;
  useEffect(() => {
    const el = document.createElement('style');
    el.textContent = SHARED_CSS;
    document.head.appendChild(el);
    return () => el.remove();
  }, []);
  return (
    <>
      <Nav/>
      <NutricionContent/>
      <Footer/>
      <FloatingContacts/>
      <BackToTop/>
    </>

}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
